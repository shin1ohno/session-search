name: ci

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    env:
      CCS_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install conformance Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check --all
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace --examples && cargo build --locked --release --bin ccs
      - name: Install local search dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Local reading and Python text differential gates
        run: |
          python3 crates/ccs-pytext/tests/text_oracle.py target/release/examples/text_probe
          python3 crates/ccs/tests/local_oracle.py
          python3 crates/ccs/tests/codepoint_oracle.py
          python3 crates/ccs/tests/review_oracle.py
      - name: Regenerate pinned Unicode tables
        run: |
          python3 crates/ccs-pytext/tools/gen_text_tables.py "$RUNNER_TEMP/tables.rs"
          diff -u crates/ccs-pytext/src/tables.rs "$RUNNER_TEMP/tables.rs"
      - name: Foundation, cross-check and locking gates
        run: |
          python3 tools/test_foundation.py
          python3 tools/test_crosscheck.py
          python3 tools/test_lock.py target/release/examples/lock_probe
          python3 tools/test_workflow.py
      - name: Ingest function oracle and negative controls
        run: |
          python3 crates/ccs/tests/ingest_oracle.py
          python3 crates/ccs/tests/ingest_mutations.py
      - name: Resume function Python differential gate
        run: python3 crates/ccs/tests/resume_oracle.py
      - name: Rust CLI, auth, helper and state interoperability contracts
        env:
          CCS_AUTH_DISK_CACHE: '1'
          CCS_RUST_CLIENT: '1'
        run: |
          npm install --prefix /tmp/ccs-rust-test-codex --no-audit --no-fund @openai/codex@0.162.1
          export CCS_TEST_CODEX=$(find /tmp/ccs-rust-test-codex/node_modules -type f -path '*/vendor/*/bin/codex' -print -quit)
          test -x "$CCS_TEST_CODEX"
          export CCS_UNDER_TEST="$GITHUB_WORKSPACE/target/release/ccs"
          mkdir -p contract-output
          set -o pipefail
          python3 crates/ccs/tests/cli_gate.py 2>&1 | tee contract-output/gate.txt
          python3 tests/contract/run_rust.py 2>&1 | tee contract-output/rust.txt
          python3 crates/ccs/tests/cli_oracle.py 2>&1 | tee contract-output/cli-oracle.txt
          python3 crates/ccs/tests/cli_interop.py 2>&1 | tee contract-output/interop.txt
      - name: Save Rust contract results including skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-cli-contract
          path: contract-output/
          if-no-files-found: error
  rust-macos:
    runs-on: macos-15
    env:
      CCS_BUILD_COMMIT: ${{ github.sha }}
      CCS_AUTH_DISK_CACHE: '1'
      CCS_RUST_CLIENT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo build --locked --release --bin ccs
      - name: Install local search and native Codex
        run: |
          command -v rg || brew install ripgrep
          npm install --prefix "$RUNNER_TEMP/ccs-test-codex" --no-audit --no-fund @openai/codex@0.162.1
      - name: Rust CLI contracts on macOS
        run: |
          export CCS_TEST_CODEX=$(find "$RUNNER_TEMP/ccs-test-codex/node_modules" -type f -path '*/vendor/*/bin/codex' -print -quit)
          test -x "$CCS_TEST_CODEX"
          export CCS_UNDER_TEST="$GITHUB_WORKSPACE/target/release/ccs"
          mkdir -p contract-output
          set -o pipefail
          python3 tests/contract/run_rust.py 2>&1 | tee contract-output/macos.txt
      - name: Diagnostic token-cache stress (temporary, non-gating)
        # The reusable release invocation skips this to keep one budget per push.
        if: always() && github.workflow == 'ci'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export CCS_UNDER_TEST="$GITHUB_WORKSPACE/target/release/ccs"
          export PYTHONPATH=tests
          mkdir -p contract-output
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee contract-output/cache-diagnostic.txt
          import io, time, unittest
          name = 'contract.test_auth_cache.TokenCacheContract.test_simultaneous_processes_share_one_grant'
          started = time.monotonic()
          for iteration in range(1, 301):
              output = io.StringIO()
              result = unittest.TextTestRunner(stream=output, verbosity=2).run(
                  unittest.defaultTestLoader.loadTestsFromName(name))
              print('Diagnostic iteration', iteration, 'passed' if result.wasSuccessful() else 'FAILED', flush=True)
              if not result.wasSuccessful() or result.skipped:
                  print(output.getvalue(), flush=True)
                  raise SystemExit(1)
              if time.monotonic() - started >= 840:
                  print('Diagnostic time budget reached after', iteration, 'iterations', flush=True)
                  break
          PY
      - name: Save macOS contracts including skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-macos-contract
          path: contract-output/
          if-no-files-found: error
  dependency-policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-linux
      - run: command -v cargo-deny || cargo install --locked --version 0.20.2 cargo-deny
      - run: python3 tools/check_dependencies.py
      - run: python3 tools/test_dependency_inventory.py
      - run: cargo deny --locked check
      - run: python3 tools/test_dependency_policy.py
  weekly-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo audit
  test-python3:
    # Preserve the existing required context while also requiring both Rust platforms/policy.
    needs: [rust, rust-macos, dependency-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux Rust, macOS Rust and dependency-policy success
        run: test '${{ needs.rust.result }}' = success && test '${{ needs.rust-macos.result }}' = success && test '${{ needs.dependency-policy.result }}' = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: ccs client suite (runner python3)
        run: |
          # Hermetic: a fake HTTP server on 127.0.0.1 and a temp $HOME.
          # Contract tests use the real vendored redactor; unit tests also
          # use FakeRedactor fixtures. ripgrep makes the
          # fallback cases run instead of skip; CCS_TEST_CODEX makes the
          # native Codex cases run instead of skip.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          npm install --prefix /tmp/ccs-test-codex --no-audit --no-fund @openai/codex@0.162.1
          codex_test_bin=$(find /tmp/ccs-test-codex/node_modules -type f -path '*/vendor/*/bin/codex' -print -quit)
          test -x "$codex_test_bin"
          contract_stage="$RUNNER_TEMP/ccs-python-contract"
          mkdir -p "$contract_stage"
          cp -R ccs "$contract_stage/"
          cp vendor/memory-mcp/session_redact.py vendor/memory-mcp/session_codex.py "$contract_stage/ccs/"
          export PYTHONPATH="$contract_stage"
          export CCS_UNDER_TEST="$(python3 -c 'import shlex, sys; print(shlex.join([sys.executable, "-m", "ccs"]))')"
          python3 -c 'import os; print("CCS_UNDER_TEST=" + os.environ["CCS_UNDER_TEST"])'
          CCS_TEST_CODEX="$codex_test_bin" python3 -m unittest discover -s tests -v

  test-python39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ripgrep and the native Codex binary
        run: |
          # The same cases as test-python3: without these the fallback and
          # native Codex cases would skip on 3.9.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          npm install --prefix /tmp/ccs-test-codex --no-audit --no-fund @openai/codex@0.162.1
          codex_test_bin=$(find /tmp/ccs-test-codex/node_modules -type f -path '*/vendor/*/bin/codex' -print -quit)
          test -x "$codex_test_bin"
          echo "CCS_TEST_CODEX=$codex_test_bin" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: ccs client suite (Python 3.9, the macOS system python)
        run: |
          python --version
          contract_stage="$RUNNER_TEMP/ccs-python-contract"
          mkdir -p "$contract_stage"
          cp -R ccs "$contract_stage/"
          cp vendor/memory-mcp/session_redact.py vendor/memory-mcp/session_codex.py "$contract_stage/ccs/"
          export PYTHONPATH="$contract_stage"
          export CCS_UNDER_TEST="$(python -c 'import shlex, sys; print(shlex.join([sys.executable, "-m", "ccs"]))')"
          python -c 'import os; print("CCS_UNDER_TEST=" + os.environ["CCS_UNDER_TEST"])'
          python -W error::ResourceWarning -m unittest discover -s tests
